# Tests, bundle and headless render checks on every push and pull request.
# Node 22 is the minimum the project supports, 24 the current LTS.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Unit and browser tests
        run: node --test --test-timeout=180000 "tests/*.test.mjs"
      - name: Build the dashboard and the demo
        run: |
          node scripts/build.mjs
          node scripts/build.mjs --with-samples --out dist/demo.html
      - name: Render check, dashboard (empty state)
        run: node scripts/render-check.mjs dist/dashboard.html
      - name: Render check, demo in Czech and dark theme
        run: node scripts/render-check.mjs dist/demo.html --lang cs --theme dark
